<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CatOrder · Catalog</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<aside class="side">
  <a class="home" href="./" title="Back to the start" style="text-decoration:none;color:inherit">
    <img class="logo" src="logo.png" alt="">
    <span class="brand toon">CatOrder</span>
  </a>
  <nav class="nav" aria-label="Sections">
    <a class="navi" href="./"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h4l2 3h4l2-3h4M6 5h12l2 8v6H4v-6z"/></svg><span>Chats</span></a>
    <a class="navi" href="forecast.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg><span>Forecast</span></a>
    <hr class="sep">
    <a class="navi" href="orders.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/></svg><span>Orders</span></a>
    <a class="navi on" href="catalog.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg><span>Catalog</span></a>
  </nav>
</aside>
<main class="ref">
  <h1 class="toon">Catalog</h1>
  <p class="lede">The distributor's price list. Every order line must match one of these products.</p>
  <div class="bar">
    <span class="cnt" id="cnt">&nbsp;</span>
    <span class="sync"><span class="dot" aria-hidden="true"></span><span id="last" aria-live="polite">Synced just now</span></span>
    <button id="syncBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg><span>Sync now</span></button>
  </div>
  <div id="out" aria-busy="true"></div>
</main>
<script src="ref.js"></script>
<script>
const draw = (cat) => {
  setCount(cat.length, 'products');
  const groups = [...Map.groupBy(cat, (p) => p.category || 'other')].sort(([a], [b]) => a.localeCompare(b));
  document.getElementById('out').innerHTML = `<div class="dt-box"><table class="dt"><thead><tr><th scope="col">Product</th><th scope="col">Pack</th><th scope="col" class="n">List price</th></tr></thead>${groups.map(([g, ps]) => `<tbody><tr class="grp"><td colspan="3">${esc(g)}<span>${ps.length}</span></td></tr>${ps.map((p) => `<tr><td class="lead"><b class="b">${esc(p.name)}</b><div class="code">${esc(p.sku)}</div></td><td class="mu span2" data-l="Pack">${esc(p.pack_label || p.sell_unit)}</td><td class="n b" data-l="List price">${eur(p.list_price)}</td></tr>`).join('')}</tbody>`).join('')}</table></div>`;
};
sync(() => fetch('/api/catalog?all=1').then((r) => r.json()).then(draw));
</script>
<script src="side.js"></script>
</body>
</html>
