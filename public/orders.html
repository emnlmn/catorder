<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CatOrder · Orders</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<aside class="side">
  <a class="home" href="./" title="Back to the start" style="text-decoration:none;color:inherit">
    <img class="logo" src="logo.png" alt="">
    <span class="brand toon">CatOrder</span>
  </a>
  <nav class="nav" aria-label="Sections">
    <a class="navi" href="./"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h4l2 3h4l2-3h4M6 5h12l2 8v6H4v-6z"/></svg><span>Chats</span></a>
    <a class="navi" href="forecast.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg><span>Forecast</span></a>
    <hr class="sep">
    <a class="navi on" href="orders.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/></svg><span>Orders</span></a>
    <a class="navi" href="catalog.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg><span>Catalog</span></a>
  </nav>
</aside>
<main class="ref">
  <h1 class="toon">Orders</h1>
  <p class="lede">Past orders, read from your ERP. When a message says “il solito”, CatOrder works it out from this history.</p>
  <div class="bar">
    <span class="cnt" id="cnt">&nbsp;</span>
    <span class="sync"><span class="dot" aria-hidden="true"></span><span id="last" aria-live="polite">Synced just now</span></span>
    <button id="syncBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg><span>Sync now</span></button>
  </div>
  <div class="seg" id="seg" role="group" aria-label="Filter by customer"></div>
  <div id="out" aria-busy="true"></div>
</main>
<script src="ref.js"></script>
<script>
const CHEV = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
let all = [], pick = new URLSearchParams(location.search).get('c') || '';
const value = (o) => o.lines.reduce((s, l) => s + l.qty * l.list_price, 0);
const draw = () => {
  const names = [...new Map(all.map((o) => [o.customer.id, o.customer.name]))];
  document.getElementById('seg').innerHTML = [['', 'All customers'], ...names].map(([id, n]) =>
    `<button type="button" data-c="${esc(id)}" aria-pressed="${id === pick}">${esc(n)}</button>`).join('');
  const os = all.filter((o) => !pick || o.customer.id === pick);
  setCount(os.length, os.length === 1 ? 'order' : 'orders');
  const sub = (l) => `<tr class="sub"><td class="fit"></td><td class="n mu">${l.qty} ×</td><td class="lead">${esc(l.name)} <span class="code">${esc(l.sku)}</span></td><td class="n mu opt">${eur(l.list_price)}</td><td class="n">${eur(l.qty * l.list_price)}</td></tr>`;
  document.getElementById('out').innerHTML = os.length
    ? `<div class="dt-box"><table class="dt"><thead><tr><th class="fit"><span class="sr">Expand</span></th><th scope="col" class="fit">Date</th><th scope="col">Customer</th><th scope="col" class="n fit">Lines</th><th scope="col" class="n fit">Total</th></tr></thead>${os.map((o, i) => `<tbody class="ordg" id="og${i}"><tr class="x"><td class="fit"><button class="tog" type="button" aria-expanded="false" aria-controls="og${i}" aria-label="Show lines">${CHEV}</button></td><td class="mu fit" data-l="Date">${esc(day(o.date))}</td><td class="lead b">${esc(o.customer.name)}</td><td class="n mu fit" data-l="Lines">${o.lines.length}</td><td class="n b fit" data-l="Total">${eur(value(o))}</td></tr>${o.lines.map(sub).join('')}</tbody>`).join('')}</table></div><p class="dt-foot">Totals at list price, before the customer's discount.</p>`
    : '<div class="dt-box"><p class="dt-empty">No orders for this customer yet.</p></div>';
};
document.getElementById('seg').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  pick = b.dataset.c; history.replaceState(null, '', pick ? '?c=' + encodeURIComponent(pick) : location.pathname); draw();
};
document.getElementById('out').onclick = (e) => {
  const r = e.target.closest('tr.x'); if (!r) return;
  const b = r.querySelector('.tog'), open = b.getAttribute('aria-expanded') !== 'true';
  b.setAttribute('aria-expanded', open); b.setAttribute('aria-label', open ? 'Hide lines' : 'Show lines');
  r.parentElement.classList.toggle('open', open);
};
sync(() => fetch('/api/history').then((r) => r.json()).then((d) => { all = d; draw(); }));
</script>
<script src="side.js"></script>
</body>
</html>
